name: Bump package and dependencies

on:
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    environment: personal-token
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false  # Avoid cache poisoning.
      - name: Compute next dev version
        run: |
          set -euo pipefail
          current=$(uv version --short)
          echo "VERSION=0.1.0.dev$(((${current#0.1.0.dev} + 1)))" >> "$GITHUB_ENV"
      - name: Bump package version
        run: uv run --script .github/scripts/bump_dev_version.py "$VERSION"
      - name: Commit package bump
        run: |
          set -euo pipefail
          git checkout -b "bump-to-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "bump package to $VERSION"
      - name: Bump dependency versions
        run: uv run --script .github/scripts/bump_deps.py
      - name: Commit dependency bumps
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git commit -am "bump deps"
      - name: Push branch with elevated permissions
        env:
          GH_TOKEN: ${{ secrets.DWILDING_GITHUB_TOKEN }}  # Needs scope "Update GitHub Action workflows".
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "bump-to-$VERSION"
      - name: Open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head "bump-to-$VERSION" \
            --title "chore: bump package to $VERSION" \
            --body "" \
            --reviewer dwilding
