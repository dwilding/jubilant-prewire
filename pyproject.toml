[project]
name = "jubilant-prewire"
version = "0.1.0.dev1"
description = "A pytest plugin that pre-pulls OCI images for K8s charm deploys."
authors = [
    { name = "Dave Wilding", email = "tech@dpw.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jubilant>=1.8,<2",
    "pyyaml>=6.0",
]

[project.entry-points.pytest11]
prewire = "jubilant_prewire._plugin"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.100",
    "zizmor==1.32.0 ; python_full_version >= '3.11'",
]

[build-system]
requires = [
    "uv_build==0.13.7"
]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
