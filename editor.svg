<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 168" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="editor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E0A23"/>
      <stop offset="100%" stop-color="#220720"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B4FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8B4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Editor fills the entire image (no title bar: this is an editor, not a terminal) -->
  <rect width="790" height="168" rx="8" fill="url(#editor)" stroke="#4A1535" stroke-width="1"/>

  <!-- Gutter -->
  <rect x="0" y="0" width="44" height="168" fill="#2A091F"/>
  <line x1="44" y1="0" x2="44" y2="168" stroke="#4A1535" stroke-width="1"/>

  <!-- Line grid: 6 rows, 24px pitch, first row top at y=12.
       Row i: top = 12 + (i-1)*24, center = top + 12.
       Gutter number baseline = center + 4 (12px font).
       Skeleton rect: 7px tall, centered -> top = center - 3.5.
       Code text baseline (14px font) = center + 5. -->

  <!-- Gutter numbers -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="12" fill="#6B4A5E" text-anchor="end">
    <text x="34" y="28">1</text>
    <text x="34" y="52">2</text>
    <text x="34" y="76">3</text>
    <text x="34" y="100">4</text>
    <text x="34" y="124">5</text>
    <text x="34" y="148">6</text>
  </g>

  <!-- Skeleton placeholder lines: rows 1, 2, 6. 7px tall, centered. -->
  <g fill="#4A2A3F">
    <rect x="60" y="20.5" width="180" height="7" rx="3.5"/>
    <rect x="60" y="44.5" width="240" height="7" rx="3.5"/>
    <rect x="60" y="140.5" width="190" height="7" rx="3.5"/>
  </g>

  <!-- Row 3: the deploy line. Band spans the full row (y=60..84). -->
  <rect x="48" y="60" width="730" height="24" rx="4" fill="url(#glow)"/>
  <rect x="48" y="60" width="3" height="24" fill="#E8B4FF"/>

  <!-- Code text: baseline = row center (72) + 5 = 77 -->
  <text x="60" y="77" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="14"><tspan fill="#E8E8E8">juju.deploy(</tspan><tspan fill="#FFA657">"postgresql-k8s"</tspan><tspan fill="#E8E8E8">, channel=</tspan><tspan fill="#FFA657">"16/stable"</tspan><tspan fill="#E8E8E8">)</tspan></text>

  <!-- Lightning bolt: 18px tall, centered on row center (72) -> top = 62.
       Positioned 4 monospace chars after the code: 60 + 54*8.4 = 513.6. -->
  <g transform="translate(513.6, 62)">
    <path d="M 9 1 L 2 11 L 7 11 L 6 19 L 13 9 L 8 9 Z" fill="#E8B4FF"/>
  </g>

  <!-- Row 4: integrate line. Baseline = center (96) + 5 = 101. -->
  <text x="60" y="101" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="14"><tspan fill="#E8E8E8">juju.integrate(</tspan><tspan fill="#FFA657">"myapp"</tspan><tspan fill="#E8E8E8">, </tspan><tspan fill="#FFA657">"postgresql-k8s"</tspan><tspan fill="#E8E8E8">)</tspan></text>

  <!-- Row 5: wait line. Baseline = center (120) + 5 = 125. -->
  <text x="60" y="125" font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace" font-size="14"><tspan fill="#E8E8E8">juju.wait(jubilant.all_active)</tspan></text>
</svg>
